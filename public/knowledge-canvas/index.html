    <style id="winkgo-project-library-desktop-fix">
      .project-library-backdrop {
        position: fixed;
        z-index: 140;
        inset: 0;
        display: flex;
        justify-content: flex-end;
        background: rgba(15, 23, 42, 0.22);
        backdrop-filter: blur(2px);
        animation: project-fade 0.16s ease;
      }

      .project-library {
        width: min(470px, 100%);
        height: 100%;
        display: flex;
        flex-direction: column;
        color: #334155;
        background: #fff;
        border-left: 1px solid #dbe1ea;
        box-shadow: -24px 0 70px rgba(15, 23, 42, 0.14);
        animation: project-slide 0.2s ease;
      }

      .project-library__header {
        min-height: 78px;
        padding: 17px 18px;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        border-bottom: 1px solid #e2e8f0;
      }

      .project-library__header small {
        color: #2563eb;
        font-size: 10px;
        font-weight: 760;
      }

      .project-library__header h2 {
        margin: 3px 0 0;
        color: #0f172a;
        font-size: 21px;
        letter-spacing: -0.025em;
      }

      .project-icon-button {
        width: 32px;
        height: 32px;
        flex: none;
        display: grid;
        place-items: center;
        padding: 0;
        color: #64748b;
        background: transparent;
        border: 1px solid transparent;
        border-radius: 8px;
        cursor: pointer;
      }

      .project-icon-button:hover,
      .project-icon-button[aria-expanded='true'] {
        color: #1d4ed8;
        background: #eff6ff;
        border-color: #dbeafe;
      }

      .project-library__tools {
        padding: 14px 16px 10px;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
      }

      .project-library__tools label {
        height: 38px;
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 0 10px;
        color: #64748b;
        background: #f8fafc;
        border: 1px solid #dbe1ea;
        border-radius: 9px;
      }

      .project-library__tools input {
        width: 100%;
        min-width: 0;
        border: 0;
        outline: 0;
        background: transparent;
        color: #0f172a;
        font-size: 12px;
      }

      .project-library__tools > button {
        height: 38px;
        padding: 0 11px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: #334155;
        background: #fff;
        border: 1px solid #cbd5e1;
        border-radius: 9px;
        font-size: 11px;
        font-weight: 700;
        cursor: pointer;
      }

      .project-library__tools > button:hover {
        color: #1d4ed8;
        background: #eff6ff;
        border-color: #93c5fd;
      }

      .project-library__tools > button:disabled,
      .project-card button:disabled {
        opacity: 0.58;
        cursor: wait;
      }

      .project-library__error {
        margin: 0 16px 8px;
        padding: 8px 10px;
        color: #b91c1c;
        background: #fef2f2;
        border: 1px solid #fecaca;
        border-radius: 8px;
        font-size: 11px;
      }

      .project-library__summary {
        padding: 4px 17px 10px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: #475569;
        font-size: 11px;
      }

      .project-library__summary span {
        font-weight: 730;
      }

      .project-library__summary small {
        color: #94a3b8;
        font-size: 9px;
      }

      .project-list {
        min-height: 0;
        flex: 1;
        overflow: auto;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
        padding: 0 12px 24px;
      }

      .project-card {
        position: relative;
        display: flex;
        align-items: flex-start;
        margin-bottom: 8px;
        border: 1px solid #dbe1ea;
        border-radius: 11px;
        background: #fff;
        transition:
          border-color 0.15s ease,
          box-shadow 0.15s ease;
      }

      .project-card:hover {
        border-color: #b8c5d6;
        box-shadow: 0 7px 22px rgba(15, 23, 42, 0.07);
      }

      .project-card__open {
        min-width: 0;
        flex: 1;
        display: flex;
        gap: 11px;
        padding: 13px 8px 13px 13px;
        text-align: left;
        background: transparent;
        border: 0;
        cursor: pointer;
      }

      .project-card__icon {
        width: 37px;
        height: 37px;
        flex: none;
        display: grid;
        place-items: center;
        color: #2563eb;
        background: #eff6ff;
        border: 1px solid #dbeafe;
        border-radius: 9px;
      }

      .project-card__copy {
        min-width: 0;
        display: grid;
        gap: 3px;
      }

      .project-card__copy strong {
        overflow: hidden;
        color: #172033;
        font-size: 13px;
        font-weight: 720;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .project-card__copy small {
        color: #64748b;
        font-size: 10px;
      }

      .project-card__copy em {
        width: max-content;
        margin-top: 2px;
        padding: 2px 6px;
        color: #64748b;
        background: #f8fafc;
        border-radius: 999px;
        font-size: 8px;
        font-style: normal;
      }

      .project-card__menu-wrap {
        position: relative;
        flex: none;
        margin: 10px 8px 0 0;
      }

      .project-card__menu {
        position: absolute;
        z-index: 3;
        top: 34px;
        right: 0;
        width: 154px;
        padding: 5px;
        background: #fff;
        border: 1px solid #dbe1ea;
        border-radius: 9px;
        box-shadow: 0 14px 36px rgba(15, 23, 42, 0.16);
      }

      .project-card__menu button {
        width: 100%;
        height: 32px;
        padding: 0 8px;
        display: flex;
        align-items: center;
        gap: 7px;
        color: #334155;
        background: transparent;
        border: 0;
        border-radius: 6px;
        font-size: 10px;
        cursor: pointer;
      }

      .project-card__menu button:hover {
        color: #1d4ed8;
        background: #eff6ff;
      }

      .project-card__menu button.is-danger {
        color: #b91c1c;
      }

      .project-card__menu button.is-danger:hover {
        background: #fef2f2;
      }

      .project-library__empty {
        min-height: 280px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #94a3b8;
        text-align: center;
      }

      .project-library__empty strong {
        margin-top: 12px;
        color: #334155;
        font-size: 13px;
      }

      .project-library__empty p {
        max-width: 270px;
        margin: 6px 0 0;
        color: #64748b;
        font-size: 11px;
        line-height: 1.55;
      }

      .project-library__retry {
        margin-top: 12px;
        padding: 7px 14px;
        color: #1d4ed8;
        background: #eff6ff;
        border: 1px solid #bfdbfe;
        border-radius: 8px;
        font-size: 11px;
        font-weight: 720;
        cursor: pointer;
      }

      @keyframes project-fade {
        from {
          opacity: 0;
        }
      }

      @keyframes project-slide {
        from {
          transform: translateX(24px);
          opacity: 0.6;
        }
      }

      @media (max-width: 520px) {
        .project-library {
          border-left: 0;
        }

        .project-library__tools {
          grid-template-columns: 1fr;
        }

        .project-library__tools > button {
          justify-content: center;
        }

        .project-library__summary small {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
