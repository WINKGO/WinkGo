<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; base-uri 'none'; script-src 'self'; style-src 'unsafe-inline'; object-src 'none'"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      #hit {
        position: absolute;
        top: 10%;
        left: 10%;
        width: 80%;
        height: 80%;

        background: transparent;
      }
      #hit.dragging {
        cursor: grabbing;
      }
