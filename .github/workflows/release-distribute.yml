# Modified from AionUI by WINK GO contributors in 2026.
name: Distribute Release Assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable release tag (for example v2.2.6)'
        required: true
        type: string
      verify_only:
        description: 'Validate GitHub assets, restricted SSH, and the current public files without publishing'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  distribute:
    name: Distribute Free release to winkgo.top
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    steps:
      - name: Check out release validation code
        uses: actions/checkout@v6

      - name: Resolve stable release version
        id: version
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${EVENT_TAG:-$INPUT_TAG}"
          VERSION="${TAG#v}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Only stable vMAJOR.MINOR.PATCH tags can be distributed: $TAG"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download the complete Free release bundle
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --dir dist \
            --pattern "WINK-GO-Free-Setup-${VERSION}-x64.exe" \
            --pattern "WINK-GO-Free-Setup-${VERSION}-x64.exe.sha256.txt" \
            --pattern "latest.yml" \
            --pattern "winkgo-free-update.json" \
            --pattern "LICENSE" \
            --pattern "NOTICE" \
            --pattern "THIRD_PARTY_NOTICES.md" \
            --pattern "THIRD_PARTY_DEPENDENCIES.json" \
            --pattern "THIRD_PARTY_LICENSES.txt" \
            --pattern "PRIVACY.md" \
            --pattern "TERMS.md"

      - name: Validate bytes and metadata before upload
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: node scripts/security/nginx-release-receiver.cjs validate "$VERSION" dist

      - name: Build the receiver whitelist archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          INSTALLER="WINK-GO-Free-Setup-${VERSION}-x64.exe"
          BUNDLE_FILES=(
            "$INSTALLER"
            "${INSTALLER}.sha256.txt"
            latest.yml
            winkgo-free-update.json
            LICENSE
            NOTICE
            THIRD_PARTY_NOTICES.md
            THIRD_PARTY_DEPENDENCIES.json
            THIRD_PARTY_LICENSES.txt
            PRIVACY.md
            TERMS.md
          )
          tar -C dist -czf release-bundle.tar.gz "${BUNDLE_FILES[@]}"

      - name: Configure restricted release SSH
        env:
          SSH_HOST: ${{ vars.WINKGO_RELEASE_HOST }}
          SSH_USER: ${{ vars.WINKGO_RELEASE_USER }}
          SSH_PORT: ${{ vars.WINKGO_RELEASE_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.WINKGO_RELEASE_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.WINKGO_RELEASE_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          for value in SSH_HOST SSH_USER SSH_PORT SSH_PRIVATE_KEY SSH_KNOWN_HOSTS; do
            if [ -z "${!value:-}" ]; then
              echo "::error::Missing release SSH configuration: $value"
              exit 1
            fi
          done
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/winkgo_release"
          chmod 600 "$HOME/.ssh/winkgo_release"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/winkgo_release_known_hosts"
          chmod 600 "$HOME/.ssh/winkgo_release_known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host winkgo-release
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile $HOME/.ssh/winkgo_release
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/winkgo_release_known_hosts
          EOF
          chmod 600 "$HOME/.ssh/config"

      - name: Probe restricted receiver
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(ssh winkgo-release probe)"
          test "$RESPONSE" = "WINKGO_RELEASE_RECEIVER_READY 1"

      - name: Publish atomically to the domestic server
        if: github.event_name != 'workflow_dispatch' || inputs.verify_only == false
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          cat release-bundle.tar.gz | ssh winkgo-release "publish $VERSION"

      - name: Verify public updater metadata and installer boundary bytes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          INSTALLER="WINK-GO-Free-Setup-${VERSION}-x64.exe"
          CACHE_BUSTER="workflow=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          EXPECTED_SIZE="$(stat --format='%s' "dist/$INSTALLER")"
          EXPECTED_SHA256="$(sha256sum "dist/$INSTALLER" | awk '{ print toupper($1) }')"
          mkdir -p public-check
          curl --fail --silent --show-error --location \
            "https://winkgo.top/releases/free/${INSTALLER}.sha256.txt?${CACHE_BUSTER}" \
            --output "public-check/${INSTALLER}.sha256.txt"
          curl --fail --silent --show-error --location \
            "https://winkgo.top/releases/free/latest.yml?${CACHE_BUSTER}" \
            --output public-check/latest.yml
          curl --fail --silent --show-error --location \
            "https://winkgo.top/winkgo-free-update.json?${CACHE_BUSTER}" \
            --output public-check/winkgo-free-update.json
          node scripts/security/nginx-release-receiver.cjs validate-public \
            "$VERSION" public-check "$EXPECTED_SHA256" "$EXPECTED_SIZE"

          INSTALLER_URL="https://winkgo.top/releases/free/${VERSION}/${INSTALLER}?${CACHE_BUSTER}"
          PUBLIC_SIZE="$(curl --fail --silent --show-error --location --head \
            --output /dev/null --write-out '%header{content-length}' "$INSTALLER_URL" | tr -d '\r')"
          test "$PUBLIC_SIZE" = "$EXPECTED_SIZE"

          FIRST_STATUS="$(curl --fail --silent --show-error --location --range 0-0 \
            --output public-check/first.byte --write-out '%{http_code}' "$INSTALLER_URL")"
          LAST_OFFSET="$((EXPECTED_SIZE - 1))"
          LAST_STATUS="$(curl --fail --silent --show-error --location --range "${LAST_OFFSET}-${LAST_OFFSET}" \
            --output public-check/last.byte --write-out '%{http_code}' "$INSTALLER_URL")"
          test "$FIRST_STATUS" = '206'
          test "$LAST_STATUS" = '206'
          head -c 1 "dist/$INSTALLER" | cmp --silent - public-check/first.byte
          tail -c 1 "dist/$INSTALLER" | cmp --silent - public-check/last.byte

          curl --fail --silent --show-error --location \
            "https://winkgo.top/?${CACHE_BUSTER}" --output public-index.html
          grep -F "https://winkgo.top/releases/free/${VERSION}/${INSTALLER}" public-index.html
          grep -F "https://github.com/WINKGO/WinkGo/releases/download/v${VERSION}/${INSTALLER}" public-index.html

      - name: Distribution summary
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          VERIFY_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_only }}
        shell: bash
        run: |
          {
            echo "### WINK GO domestic distribution"
            echo ""
            echo "- Tag: \`$TAG\`"
            echo "- Version: \`$VERSION\`"
            echo "- Verify only: \`$VERIFY_ONLY\`"
            echo "- Public feed: \`https://winkgo.top/releases/free/latest.yml\`"
            echo "- Website manifest: \`https://winkgo.top/winkgo-free-update.json\`"
          } >> "$GITHUB_STEP_SUMMARY"
