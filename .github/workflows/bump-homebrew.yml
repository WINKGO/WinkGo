# Modified from AionUI by WINK GO contributors in 2026.
name: Validate Homebrew Template

on:
  workflow_dispatch:
  pull_request:
    paths:
      - homebrew/winkgo.rb.example
      - .github/workflows/bump-homebrew.yml

permissions:
  contents: read

jobs:
  validate-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Ruby syntax
        run: ruby -c homebrew/winkgo.rb.example
