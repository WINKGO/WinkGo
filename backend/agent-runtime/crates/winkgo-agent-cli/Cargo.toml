winkgo-agent-mcp.workspace      = true
winkgo-agent-protocol.workspace = true
winkgo-agent-skills.workspace   = true
winkgo-agent-types.workspace    = true

tokio.workspace              = true
anyhow.workspace             = true
clap.workspace               = true
tracing.workspace            = true
tracing-subscriber.workspace = true
workspace-hack.workspace = true
