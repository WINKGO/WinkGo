# Modified from aionrs by WINK GO contributors in 2026.
[package]
name = "winkgo-agent"
description = "Agent engine, session management, output sinks, and orchestration for winkgo_agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
winkgo-agent-types.workspace     = true
winkgo-agent-protocol.workspace  = true
winkgo-agent-config.workspace    = true
winkgo-agent-providers.workspace = true
winkgo-agent-tools.workspace     = true
winkgo-agent-mcp.workspace       = true
winkgo-agent-skills.workspace    = true
winkgo-agent-memory.workspace    = true
winkgo-agent-compact.workspace   = true

tracing.workspace     = true
tokio.workspace       = true
futures.workspace     = true
serde.workspace       = true
serde_json.workspace  = true
async-trait.workspace = true
anyhow.workspace      = true
thiserror.workspace   = true
glob.workspace        = true
chrono.workspace      = true
uuid.workspace        = true
dirs.workspace        = true
crossterm.workspace   = true
is-terminal.workspace = true
workspace-hack.workspace = true

[dev-dependencies]
winkgo-agent-mcp = { path = "../winkgo-agent-mcp", features = ["test-utils"] }
wiremock.workspace    = true
tokio-test.workspace  = true
tempfile.workspace    = true
mockall.workspace     = true
rstest.workspace      = true
serial_test.workspace = true
base64.workspace    = true

# ── Integration test binaries ──────────────────────────────────────────────
[[test]]
name = "e2e"
path = "tests/e2e/mod.rs"
# E2E tests require real API keys; run via: cargo nextest run --profile e2e --test e2e

[[test]]
name = "acceptance"
path = "tests/acceptance/mod.rs"
# Acceptance tests for evolution features; run via: cargo nextest run --profile e2e --test acceptance
